[project]
name = "house-price-prediction"
version = "0.1.0"
description = "Sistema End-to-End para predicción de precios de casas"
authors = [
    {name = "ivanjcs",email = "ivanelgallego2@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "google-cloud-bigquery (>=3.42.3,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "db-dtypes (>=1.7.1,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "xgboost (>=3.4.0,<4.0.0)",
    "optuna (>=4.9.0,<5.0.0)",
    "google-cloud-bigquery-storage (>=2.40.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
